[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-agent-verify"
version = "0.1.0"
description = "Local pre-flight checks for Lean proof-bounty artifacts (tokens, composition, axioms, budget)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
preflight = "preflight.cli:main"

[tool.setuptools]
packages = ["preflight"]
